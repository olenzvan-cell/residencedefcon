<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Сайт с боковым меню</title>
    <style>
        /* Базовые настройки страницы */
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: Arial, sans-serif;
            background-color: #f4f4f9;
            color: #333;
            min-height: 100vh;
        }

        /* Иконка «три палки» (гамбургер) */
        .menu-btn {
            position: fixed;
            top: 20px;
            left: 20px;
            z-index: 1001;
            background: none;
            border: none;
            cursor: pointer;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            width: 30px;
            height: 22px;
        }

        .menu-btn span {
            display: block;
            height: 3px;
            width: 100%;
            background-color: #333;
            border-radius: 3px;
            transition: background-color 0.3s ease;
        }

        /* Выезжающее боковое окно */
        .sidebar {
            position: fixed;
            top: 0;
            left: 0;
            height: 100%;
            width: 280px;
            max-width: 45vw; /* Меньше половины экрана даже на телефоне */
            background-color: #ffffff;
            box-shadow: 2px 0 12px rgba(0, 0, 0, 0.15);
            padding: 80px 12px 20px 12px; /* Уменьшенные боковые отступы для телефона */
            transform: translateX(-100%);
            transition: transform 0.35s ease-in-out;
            z-index: 1000;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        /* Класс для открытого состояния */
        .sidebar.open {
            transform: translateX(0);
        }

        /* Кнопки внутри меню */
        .sidebar button {
            background-color: #f0f2f5;
            border: none;
            border-radius: 8px;
            padding: 12px 12px;
            text-align: left;
            font-size: 15px;
            line-height: 1.3; /* Красивый интервал между строками при переносе */
            color: #222;
            cursor: pointer;
            transition: background-color 0.2s ease;
            width: 100%;
        }

        .sidebar button:hover {
            background-color: #e2e6ea;
        }

        /* Основной контент страницы */
        .main-content {
            padding: 80px 20px;
            text-align: center;
        }
    </style>
</head>
<body>

    <!-- Кнопка с тремя полосками -->
    <button class="menu-btn" id="menuToggle" aria-label="Открыть меню">
        <span></span>
        <span></span>
        <span></span>
    </button>

    <!-- Боковая панель -->
    <nav class="sidebar" id="sidebar">
        <button type="button">Мир</button>
        <button type="button">США</button>
        <button type="button">Велико-<br>британия</button>
        <button type="button">Франция</button>
        <button type="button">Россия</button>
    </nav>

    <!-- Основная часть сайта -->
    <main class="main-content">
        <h1>Добро пожаловать на сайт</h1>
        <p>Нажмите на три полоски в левом верхнем углу, чтобы открыть меню.</p>
    </main>

    <script>
        const menuToggle = document.getElementById('menuToggle');
        const sidebar = document.getElementById('sidebar');

        menuToggle.addEventListener('click', () => {
            sidebar.classList.toggle('open');
        });
    </script>

</body>
  </html>
